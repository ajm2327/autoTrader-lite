name: CI Tests

# When to run this workflow:
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Set up test environment variables
        run: |
          echo "ALPACA_API_KEY=fake_key" >> $GITHUB_ENV
          echo "ALPACA_API_SECRET=fake_secret" >> $GITHUB_ENV
          echo "GOOGLE_API_KEY=fake_google_key" >> $GITHUB_ENV

      - name: Run Tests
        run: |
          pytest tests/ -v